name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # Suma publicada de gitleaks_8.30.1_linux_x64.tar.gz; cambia junto con la versión
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  check:
    name: Formato, lint, tipos, pruebas, commits y secretos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint y gitleaks leen la historia
          persist-credentials: false
      - uses: pnpm/action-setup@v6 # la versión de pnpm sale de «packageManager»
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm lint
      - run: pnpm lint:rules
      - run: pnpm typecheck # antes genera los tipos de las rutas: un enlace a una pantalla que no existe no compila
      - run: pnpm test:coverage
      - run: pnpm test:scripts
      - name: Revisar el mensaje de los commits que llegan
        env:
          # En un pull request, desde su base; en un push, desde donde estaba la rama
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Una rama nueva o un push forzado no traen un punto de partida que exista: se revisa toda la historia
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-list --max-parents=0 "$AFTER" | tail -n 1)"
          fi
          pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
      - name: Buscar llaves y secretos en toda la historia
        run: |
          cd "$RUNNER_TEMP"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum --check -
          tar xzf "${file}" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner
